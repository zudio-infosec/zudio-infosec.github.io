name: Sync writeup count

# Keeps the portfolio's "CTF WRITEUPS" counter honest forever.
# Counts every .md at ANY depth in the ctf-writeups repo, minus every README.md,
# then rewrites the number in index.html. Runs on every push to ctf-writeups,
# on a daily schedule, and manually.

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: portfolio
          persist-credentials: true

      - name: Check out ctf-writeups
        uses: actions/checkout@v4
        with:
          repository: zudio-infosec/ctf-writeups
          path: ctf-writeups

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count writeups and patch index.html
        id: count
        working-directory: portfolio
        run: |
          python3 scripts/count_writeups.py \
            --repo ../ctf-writeups \
            --html index.html \
            --list | tee count-output.txt
          TOTAL=$(grep -oE 'WRITEUP COUNT[[:space:]]*:[[:space:]]*[0-9]+' count-output.txt | grep -oE '[0-9]+$')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Writeup total: $TOTAL"

      - name: Commit if changed
        working-directory: portfolio
        env:
          TOTAL: ${{ steps.count.outputs.total }}
        run: |
          rm -f count-output.txt
          if git diff --quiet -- index.html; then
            echo "Counter already up to date - no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync writeup count ($TOTAL writeups)"
          git push
