<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 // Not Found | Zudio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --green: #00ff41; --dark: #050a05; --text: #b0c4b0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark); color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px;
  }
  h1 {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: clamp(3rem, 12vw, 7rem); color: var(--green);
    text-shadow: 0 0 30px var(--green); letter-spacing: 4px;
  }
  p { margin: 16px 0 32px; font-size: 1rem; max-width: 480px; line-height: 1.7; }
  a {
    color: var(--green); border: 1px solid var(--green);
    padding: 12px 24px; text-decoration: none; letter-spacing: 2px;
    text-transform: uppercase; font-size: 0.8rem; transition: all 0.3s;
  }
  a:hover { background: var(--green); color: var(--dark); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <h1>404</h1>
  <p>[ ERROR ] Requested path not found on this host. The route you tried doesn't exist — or has been moved.</p>
  <a href="/">cd ~ && return home</a>
</body>
</html>
