<style>
  :root { --green: #00ff41; --dark: #050a05; --text: #b0c4b0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark); color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px;
  }
  h1 {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: clamp(3rem, 12vw, 7rem); color: var(--green);
    text-shadow: 0 0 30px var(--green); letter-spacing: 4px;
  }
  p { margin: 16px 0 32px; font-size: 1rem; max-width: 480px; line-height: 1.7; }
  a {
    color: var(--green); border: 1px solid var(--green);
    padding: 12px 24px; text-decoration: none; letter-spacing: 2px;
    text-transform: uppercase; font-size: 0.8rem; transition: all 0.3s;
  }
  a:hover { background: var(--green); color: var(--dark); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* SVG brand icons (platform cards + footer pills) */
  .plat-icon {
    fill: currentColor;
    color: var(--green);
    display: block;
    margin: 0 auto;
    transition: transform 0.3s ease, color 0.3s ease;
  }
  .platform-card:hover .plat-icon { transform: scale(1.12); }
  .pill-icon {
    fill: currentColor;
    vertical-align: -2px;
    margin-right: 5px;
  }
  .social-pill {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .social-pill:hover .pill-icon { color: var(--green); }
